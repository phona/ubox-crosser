name: Bootstrap & Verify

on:
  workflow_dispatch:
  push:
    branches: [ci-setup]

env:
  GO_VERSION: '1.23'

jobs:
  bootstrap:
    name: Bootstrap Go Modules & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # ── Step 1: go mod tidy (generate go.sum, fix deps) ──
      - name: Go mod tidy
        run: |
          go mod tidy
          echo "=== go.mod ==="
          cat go.mod
          echo ""
          echo "=== go.sum (first 20 lines) ==="
          head -20 go.sum

      # ── Step 2: Compile all packages ──
      - name: Build all
        run: |
          echo "=== Building all packages ==="
          go build ./...
          echo "=== Building binaries ==="
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/client ./cmd/client
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/server ./cmd/server
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/auth_server ./cmd/auth_server
          ls -lh bin/

      # ── Step 3: go vet ──
      - name: Go vet
        run: go vet ./...

      # ── Step 4: golangci-lint ──
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

      # ── Step 5: Unit tests (if any exist) ──
      - name: Run tests
        run: go test -short -v -count=1 ./... || echo "No tests found (expected for initial setup)"

      # ── Step 6: Docker build verify ──
      - name: Docker build (server)
        run: docker build -t ubox-crosser-server --build-arg BINARY=server -f Dockerfile .

      - name: Docker build (client)
        run: docker build -t ubox-crosser-client --build-arg BINARY=client -f Dockerfile .

      - name: Docker build (auth_server)
        run: docker build -t ubox-crosser-auth-server --build-arg BINARY=auth_server -f Dockerfile .

      # ── Step 7: Integration test infra verify ──
      - name: Integration test (docker compose build)
        run: docker compose -f tests/docker-compose.yml build

      # ── Step 8: Commit go.sum back if generated ──
      - name: Commit go.sum
        run: |
          if [[ -n $(git diff --name-only) ]] || [[ -n $(git ls-files --others --exclude-standard) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "build: add go.sum from go mod tidy" || echo "Nothing to commit"
            git push
          else
            echo "No changes to commit"
          fi
