name: Build & Push Docker Images

env:
  CGO_ENABLED: 0
  REGISTRY: ghcr.io
  IMAGE_NAME: phona

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      branch:
        description: "branch (e.g., release)"
        required: true
        type: choice
        options:
          - "test"
          - "release"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        binary:
          - name: client
            image: ubox-crosser-client
          - name: server
            image: ubox-crosser-server
          - name: auth_server
            image: ubox-crosser-auth-server
    env:
      BRANCH: ${{ github.event_name == 'push' && github.ref || github.event.inputs.branch }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Set IMAGE_TAG prefix
        run: |
          if [ "${BRANCH}" = "release" ] || [ "${BRANCH}" = "refs/heads/release" ]; then
            echo "IMAGE_TAG_PREFIX=" >> $GITHUB_ENV
          elif echo "${BRANCH}" | grep -q '^refs/tags/'; then
            if git fetch origin release 2>/dev/null && git merge-base --is-ancestor HEAD origin/release 2>/dev/null; then
              echo "IMAGE_TAG_PREFIX=" >> $GITHUB_ENV
            else
              echo "IMAGE_TAG_PREFIX=test-" >> $GITHUB_ENV
            fi
          else
            echo "IMAGE_TAG_PREFIX=test-" >> $GITHUB_ENV
          fi

      - name: Set image version tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            REF="${{ github.ref_name }}"
            SAFE="${REF//\//-}"
            SAFE="${SAFE//:/-}"
            echo "IMAGE_VERSION=$SAFE" >> $GITHUB_ENV
          else
            echo "IMAGE_VERSION=$(git log -1 --pretty=format:%h -- .)" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.binary.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BINARY=${{ matrix.binary.name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.binary.image }}:${{ env.IMAGE_TAG_PREFIX }}${{ env.IMAGE_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.binary.image }}:${{ env.IMAGE_TAG_PREFIX }}latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
