openapi: "3.1.0"
info:
  title: ubox-crosser Proxy Server Health API
  version: "1.0.0"
  description: >
    HTTP health-check endpoint for the ubox-crosser proxy server.
    Runs on a separate port (default :8080) from the main TCP protocol port.

servers:
  - url: http://localhost:8080
    description: Default health endpoint (configurable via --health-address)

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: >
        Returns the current health status of the proxy server process.
        A 200 response indicates the process is running and the HTTP listener is operational.
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Health status indicator
      additionalProperties: false
