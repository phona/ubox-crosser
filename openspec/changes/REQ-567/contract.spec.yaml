---
# Contract Spec for REQ-567: GET /healthz JSON Health Check
# Defines the HTTP API contract for the health check endpoint.

endpoint: GET /healthz
transport: HTTP/1.1
port: configurable (default 8080)

request:
  method: GET
  path: /healthz
  headers: none required
  body: none

response:
  success:
    status_code: 200
    content_type: application/json
    body:
      status:
        type: string
        value: "ok"
        required: true
      uptime_seconds:
        type: integer
        constraints:
          - Must be >= 0
        required: true
      services:
        type: array of string
        description: List of registered service names
        required: true
        constraints:
          - Must not be null (empty array is valid)

  errors:
    method_not_allowed:
      condition: Request method is not GET (e.g., POST, PUT, DELETE)
      status_code: 405

    not_found:
      condition: Request path is not /healthz
      status_code: 404

test_contract:
  file: tests/integration/healthz_test.go
  locked: true
  build_tag: integration
  cases:
    - name: TestHealthzReturnsOK
      validates: GET /healthz returns 200 with valid JSON body
    - name: TestHealthzContentTypeJSON
      validates: Response Content-Type is application/json
    - name: TestHealthzBodyStructure
      validates: Response contains status, uptime_seconds, services fields
    - name: TestHealthzStatusFieldIsOK
      validates: status field value is "ok"
    - name: TestHealthzUptimeNonNegative
      validates: uptime_seconds is >= 0
    - name: TestHealthzServicesNotNull
      validates: services field is a non-null array
    - name: TestHealthzServicesContainsConfigured
      validates: services array includes configured service names
    - name: TestHealthzMethodNotAllowed
      validates: POST /healthz returns 405
    - name: TestHealthzNotFound
      validates: GET /nonexistent returns 404
    - name: TestHealthzUptimeIncreases
      validates: Two requests show non-decreasing uptime
