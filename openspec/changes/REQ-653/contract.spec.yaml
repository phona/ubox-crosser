openapi: "3.1.0"
info:
  title: ubox-crosser Admin API
  version: "0.1.0"
paths:
  /version:
    get:
      operationId: getVersion
      summary: Return build metadata
      responses:
        "200":
          description: Build version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
components:
  schemas:
    VersionInfo:
      type: object
      required:
        - version
        - commit
        - build_time
      properties:
        version:
          type: string
          example: "0.1.0"
        commit:
          type: string
          example: "abc1234"
        build_time:
          type: string
          format: date-time
          example: "2026-04-20T12:00:00Z"
