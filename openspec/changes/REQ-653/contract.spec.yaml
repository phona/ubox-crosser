openapi: "3.1.0"
info:
  title: ubox-crosser Admin API
  version: "0.1.0"
  description: |
    Build metadata endpoint for the ubox-crosser proxy server.
    Locked contract for REQ-653. Any change to path / method / status / header /
    body field names breaks the contract and requires a new REQ.

servers:
  - url: http://localhost:8080
    description: |
      Admin HTTP listener on the configurable --admin-addr (default :8080).
      Separate from the tunnel TCP protocol.

paths:
  /version:
    get:
      operationId: getVersion
      summary: Return build version metadata
      description: |
        Returns JSON containing the application version, git commit SHA,
        and build timestamp. No authentication required.
      security: []
      responses:
        "200":
          description: Build metadata
          headers:
            Content-Type:
              schema:
                type: string
                enum: ["application/json"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              example:
                version: "0.1.0"
                commit: "abc1234"
                build_time: "2026-04-20T12:00:00Z"
    post:
      operationId: postVersionNotAllowed
      summary: Method not allowed
      responses:
        "405":
          description: Only GET is allowed.
          headers:
            Allow:
              schema:
                type: string
                enum: ["GET"]
    put:
      operationId: putVersionNotAllowed
      summary: Method not allowed
      responses:
        "405":
          description: Only GET is allowed.
          headers:
            Allow:
              schema:
                type: string
                enum: ["GET"]
    delete:
      operationId: deleteVersionNotAllowed
      summary: Method not allowed
      responses:
        "405":
          description: Only GET is allowed.
          headers:
            Allow:
              schema:
                type: string
                enum: ["GET"]
    patch:
      operationId: patchVersionNotAllowed
      summary: Method not allowed
      responses:
        "405":
          description: Only GET is allowed.
          headers:
            Allow:
              schema:
                type: string
                enum: ["GET"]

  /{path}:
    get:
      operationId: catchAllNotFound
      summary: Unknown path
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "404":
          description: Path not found. Only `/version` is served.

components:
  schemas:
    VersionResponse:
      type: object
      required:
        - version
        - commit
        - build_time
      additionalProperties: false
      properties:
        version:
          type: string
          description: Semantic version of the application.
          example: "0.1.0"
        commit:
          type: string
          description: Short git commit SHA at build time.
          example: "abc1234"
        build_time:
          type: string
          description: ISO 8601 timestamp of the build.
          example: "2026-04-20T12:00:00Z"
