openapi: "3.0.3"
info:
  title: ubox-crosser buildinfo
  version: "1.0"
paths:
  /buildinfo:
    get:
      summary: Return build metadata
      responses:
        "200":
          description: Build info
          content:
            application/json:
              schema:
                type: object
                required: [git_sha, build_id, go_version]
                properties:
                  git_sha:
                    type: string
                    description: 7-character short git SHA or "dev"
                  build_id:
                    type: string
                    description: Value of BUILD_ID env var, or "dev" when absent
                  go_version:
                    type: string
                    example: go1.23
