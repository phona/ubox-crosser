openapi: "3.0.3"
info:
  title: ubox-crosser /buildinfo
  version: "1.0.0"
  description: Returns build metadata for the running server binary.

paths:
  /buildinfo:
    get:
      summary: Get build metadata
      description: >
        Returns git SHA, CI build identifier, and Go runtime version for the
        currently running server binary. No authentication required.
      responses:
        "200":
          description: Build metadata JSON
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"
              example:
                git_sha: "abc1234"
                build_id: "ci-run-42"
                go_version: "go1.23"

components:
  schemas:
    BuildInfo:
      type: object
      required:
        - git_sha
        - build_id
        - go_version
      properties:
        git_sha:
          type: string
          description: >
            Short (7-char) Git commit hash injected at build time via
            -X main.GitSHA=$(git rev-parse --short HEAD).
          example: "abc1234"
        build_id:
          type: string
          description: >
            CI pipeline run identifier from the BUILD_ID environment variable.
            Defaults to "dev" when the variable is not set.
          example: "ci-run-42"
        go_version:
          type: string
          description: Go runtime version (hardcoded to "go1.23").
          enum:
            - "go1.23"
