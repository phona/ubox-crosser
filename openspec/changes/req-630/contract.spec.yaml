openapi: "3.0.3"
info:
  title: ubox-crosser Version API
  version: "0.1.0"
  description: Build metadata endpoint for the ubox-crosser proxy server.

paths:
  /version:
    get:
      operationId: getVersion
      summary: Return build version metadata
      security: []
      responses:
        "200":
          description: Build metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

components:
  schemas:
    VersionResponse:
      type: object
      required:
        - version
        - commit
        - build_time
      additionalProperties: false
      properties:
        version:
          type: string
          description: Semantic version of the application.
          example: "0.1.0"
        commit:
          type: string
          description: Short git commit SHA at build time.
          example: "abc1234"
        build_time:
          type: string
          description: ISO 8601 timestamp of the build.
          example: "2024-01-15T10:30:00Z"
