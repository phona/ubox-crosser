openapi: "3.1.0"
info:
  title: ubox-crosser Admin API
  version: "0.1.0"
  description: Lightweight admin HTTP API for the ubox-crosser proxy tunnel.
paths:
  /ping:
    get:
      operationId: getPing
      summary: Connectivity echo check
      description: Returns plain-text "pong" to confirm the admin server is reachable.
      responses:
        "200":
          description: Server is reachable
          content:
            text/plain:
              schema:
                type: string
                const: "pong"
                example: "pong"
        "405":
          description: Method not allowed (non-GET requests)
    post:
      operationId: postPingNotAllowed
      summary: Not allowed
      responses:
        "405":
          description: Method not allowed
    put:
      operationId: putPingNotAllowed
      summary: Not allowed
      responses:
        "405":
          description: Method not allowed
    delete:
      operationId: deletePingNotAllowed
      summary: Not allowed
      responses:
        "405":
          description: Method not allowed
