# ubox-crosser SonarQube Configuration
# ======================================

# Project identification
sonar.projectKey=ubox-crosser
sonar.projectName=UBox Crosser
sonar.projectVersion=1.0

# Source code locations
sonar.sources=.
sonar.tests=.

# Test file patterns
sonar.test.inclusions=**/*_test.go

# Exclusions
sonar.exclusions=\
  vendor/**,\
  tests/**,\
  cmd/**/*.json,\
  **/*.md

sonar.coverage.exclusions=\
  tests/**,\
  cmd/**

# Go coverage
sonar.go.coverage.reportPaths=coverage/unit.out,coverage/integration.out

# Encoding
sonar.sourceEncoding=UTF-8

# Skip SSL certificate verification (for self-signed certs)
sonar.scanner.skipSystemTruststore=true
sonar.scanner.trustAllCertificates=true

# SCM
sonar.scm.provider=git

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
