version: '3.8'

services:
  ubox-crosser:
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        BINARY: server
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      - BUILD_ID=${BUILD_ID:-test-build-001}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - test-network

  test-runner:
    image: golang:1.23
    depends_on:
      ubox-crosser:
        condition: service_healthy
    networks:
      - test-network
    working_dir: /src
    volumes:
      - ../../:/src:ro
    environment:
      - SERVER_ADDR=ubox-crosser:8080
    command: go test -v -count=1 -tags acceptance ./tests/acceptance/...

networks:
  test-network:
    driver: bridge
