version: '3.8'

services:
  ubox-crosser:
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        - COMMIT=${GIT_COMMIT:-$(git rev-parse HEAD)}
    container_name: ubox-crosser-e2e
    ports:
      - "${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    environment:
      - ADMIN_SERVER_ADDR=:${ADMIN_PORT:-8080}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ADMIN_PORT:-8080}/version"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - e2e-test

networks:
  e2e-test:
    driver: bridge
